services:
  - type: web
    name: egx-lite-market-radar
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python web_server.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: 3.14
      - key: DATA_PROVIDER
        value: shadow
      - key: EGXAPI_KEY
        sync: false
      - key: EGXAPI_ENV
        value: paper
      - key: SCAN_INTERVAL_MINUTES
        value: "30"
      - key: ALLOW_DEV_SERVER_FALLBACK
        value: "false"
